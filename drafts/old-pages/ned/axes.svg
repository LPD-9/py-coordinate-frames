<text x="222" y="236" text-anchor="end" fill="#1f2933" font-size="14">your chosen zero</text>
<text x="460" y="112" fill="#b84a06" font-weight="700">N: forwards,</text><text x="460" y="132" fill="#b84a06" font-weight="700">if you face north</text>
