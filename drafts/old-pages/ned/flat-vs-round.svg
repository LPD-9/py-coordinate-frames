<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16">
<rect x="1" y="1" width="638" height="378" rx="14" fill="#f6f8fa" stroke="#d5dbe1"/>
<path d="M50 110 Q300 110 550 250 L550 330 L50 330 Z" fill="#dcebf7"/>
<path d="M50 110 Q300 110 550 250" fill="none" stroke="#5b7083" stroke-width="3"/>
<line x1="50" y1="110" x2="600" y2="110" stroke="#a67c00" stroke-width="3"/>
<circle cx="50" cy="110" r="8" fill="#1f2933"/><text x="40" y="92" fill="#1f2933" font-weight="700">zero</text>
<text x="330" y="96" fill="#a67c00" font-weight="700">NED's ground: perfectly flat</text>
<text x="80" y="200" fill="#5b7083" font-weight="700">the real Earth curves away</text>
<g stroke="#b91c1c" stroke-width="2.5" stroke-dasharray="5 4"><line x1="200" y1="110" x2="200" y2="122.6"/><line x1="375" y1="110" x2="375" y2="169"/><line x1="550" y1="110" x2="550" y2="250"/></g>
<g fill="#b91c1c" font-weight="700"><text x="200" y="148" text-anchor="middle">1 km: 8 cm</text><text x="388" y="148">10 km: 8 m</text></g>
<text x="540" y="200" fill="#b91c1c" font-weight="700" text-anchor="end" stroke="#f6f8fa" stroke-width="4" paint-order="stroke">100 km: 785 m</text>
<text x="320" y="360" fill="#5b7083" font-size="14" text-anchor="middle">Not to scale. The gap grows quickly the further you go from zero.</text>
</svg>
