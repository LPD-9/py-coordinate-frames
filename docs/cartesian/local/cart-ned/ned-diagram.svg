<text x="538.1" y="237.8" fill="#b84a06" font-size="13.5" font-weight="700" text-anchor="end" stroke="#f6f8fa" stroke-width="4" paint-order="stroke" stroke-linejoin="round">N = 700 m</text>
<text x="616.9" y="253.7" fill="#1d5fbf" font-size="13.5" font-weight="700" text-anchor="start" stroke="#f6f8fa" stroke-width="4" paint-order="stroke" stroke-linejoin="round">E = 500 m</text>
<text x="651.7" y="212.7" fill="#15753a" font-size="13.5" font-weight="700" text-anchor="start" stroke="#f6f8fa" stroke-width="4" paint-order="stroke" stroke-linejoin="round">D = −500 m</text>
<text x="320.0" y="412.0" fill="#5b7083" font-size="13" text-anchor="start">Down is positive, so the pin, 500 m up, has a negative D.</text>
<text x="320.0" y="430.0" fill="#5b7083" font-size="13" text-anchor="start">Each square is 500 m. North, east and down are at right angles.</text>
