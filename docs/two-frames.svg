<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>The same toy, described from two corners</title>
<rect x="1" y="1" width="758" height="398" rx="14" fill="#f6f8fa" stroke="#d5dbe1"/>
<text x="30.0" y="44.0" fill="#1f2933" font-size="18" font-weight="700" text-anchor="start">One room, one toy, two frames</text>
<rect x="60" y="100" width="368" height="230" fill="#fff" stroke="#5b7083" stroke-width="2"/>
<line x1="106.0" y1="330.0" x2="106.0" y2="100.0" stroke="#d5dbe1" stroke-width="1" opacity="1" stroke-linecap="round"/>
<line x1="152.0" y1="330.0" x2="152.0" y2="100.0" stroke="#d5dbe1" stroke-width="1" opacity="1" stroke-linecap="round"/>
<line x1="198.0" y1="330.0" x2="198.0" y2="100.0" stroke="#d5dbe1" stroke-width="1" opacity="1" stroke-linecap="round"/>
<line x1="244.0" y1="330.0" x2="244.0" y2="100.0" stroke="#d5dbe1" stroke-width="1" opacity="1" stroke-linecap="round"/>
<line x1="290.0" y1="330.0" x2="290.0" y2="100.0" stroke="#d5dbe1" stroke-width="1" opacity="1" stroke-linecap="round"/>
<line x1="336.0" y1="330.0" x2="336.0" y2="100.0" stroke="#d5dbe1" stroke-width="1" opacity="1" stroke-linecap="round"/>
<line x1="382.0" y1="330.0" x2="382.0" y2="100.0" stroke="#d5dbe1" stroke-width="1" opacity="1" stroke-linecap="round"/>
<line x1="60.0" y1="284.0" x2="428.0" y2="284.0" stroke="#d5dbe1" stroke-width="1" opacity="1" stroke-linecap="round"/>
<line x1="60.0" y1="238.0" x2="428.0" y2="238.0" stroke="#d5dbe1" stroke-width="1" opacity="1" stroke-linecap="round"/>
<line x1="60.0" y1="192.0" x2="428.0" y2="192.0" stroke="#d5dbe1" stroke-width="1" opacity="1" stroke-linecap="round"/>
<line x1="60.0" y1="146.0" x2="428.0" y2="146.0" stroke="#d5dbe1" stroke-width="1" opacity="1" stroke-linecap="round"/>
<line x1="60.0" y1="330.0" x2="151.6" y2="330.0" stroke="#1d5fbf" stroke-width="4" opacity="1" stroke-linecap="round"/>
<polygon points="161.2,330.0 150.2,334.9 150.2,325.1" fill="#1d5fbf" opacity="1"/>
<line x1="60.0" y1="330.0" x2="60.0" y2="238.4" stroke="#b84a06" stroke-width="4" opacity="1" stroke-linecap="round"/>
<polygon points="60.0,228.8 64.9,239.8 55.1,239.8" fill="#b84a06" opacity="1"/>
<circle cx="60.0" cy="330.0" r="7" fill="#1d5fbf" stroke="#fff" stroke-width="2.5"/>
<text x="165.8" y="352.0" fill="#1d5fbf" font-size="13" font-weight="700" text-anchor="middle" stroke="#f6f8fa" stroke-width="4" paint-order="stroke" stroke-linejoin="round">across</text>
<text x="50.0" y="224.2" fill="#b84a06" font-size="13" font-weight="700" text-anchor="end" stroke="#f6f8fa" stroke-width="4" paint-order="stroke" stroke-linejoin="round">up</text>
<text x="52.0" y="354.0" fill="#1d5fbf" font-size="14" font-weight="700" text-anchor="end" stroke="#f6f8fa" stroke-width="4" paint-order="stroke" stroke-linejoin="round">zero A</text>
<line x1="60.0" y1="330.0" x2="290.0" y2="330.0" stroke="#1d5fbf" stroke-width="2" stroke-dasharray="6 5" opacity="0.6" stroke-linecap="round"/>
<line x1="290.0" y1="330.0" x2="290.0" y2="192.0" stroke="#b84a06" stroke-width="2" stroke-dasharray="6 5" opacity="0.6" stroke-linecap="round"/>
<line x1="428.0" y1="100.0" x2="336.4" y2="100.0" stroke="#be185d" stroke-width="4" opacity="1" stroke-linecap="round"/>
<polygon points="326.8,100.0 337.8,95.1 337.8,104.9" fill="#be185d" opacity="1"/>
<line x1="428.0" y1="100.0" x2="428.0" y2="191.6" stroke="#6d28d9" stroke-width="4" opacity="1" stroke-linecap="round"/>
<polygon points="428.0,201.2 423.1,190.2 432.9,190.2" fill="#6d28d9" opacity="1"/>
<circle cx="428.0" cy="100.0" r="7" fill="#be185d" stroke="#fff" stroke-width="2.5"/>
<text x="322.2" y="90.0" fill="#be185d" font-size="13" font-weight="700" text-anchor="middle" stroke="#f6f8fa" stroke-width="4" paint-order="stroke" stroke-linejoin="round">left</text>
<text x="438.0" y="205.8" fill="#6d28d9" font-size="13" font-weight="700" text-anchor="start" stroke="#f6f8fa" stroke-width="4" paint-order="stroke" stroke-linejoin="round">down</text>
<text x="436.0" y="90.0" fill="#be185d" font-size="14" font-weight="700" text-anchor="start" stroke="#f6f8fa" stroke-width="4" paint-order="stroke" stroke-linejoin="round">zero B</text>
<line x1="428.0" y1="100.0" x2="290.0" y2="100.0" stroke="#be185d" stroke-width="2" stroke-dasharray="6 5" opacity="0.6" stroke-linecap="round"/>
<line x1="290.0" y1="100.0" x2="290.0" y2="192.0" stroke="#6d28d9" stroke-width="2" stroke-dasharray="6 5" opacity="0.6" stroke-linecap="round"/>
<rect x="279" y="181" width="22" height="22" rx="5" fill="#e11d48" stroke="#fff" stroke-width="2.5"/>
<text x="306.0" y="197.0" fill="#e11d48" font-size="14" font-weight="700" text-anchor="start" stroke="#f6f8fa" stroke-width="4" paint-order="stroke" stroke-linejoin="round">toy</text>
<text x="60.0" y="382.0" fill="#5b7083" font-size="13" text-anchor="start">Each square is 1 metre.</text>
<text x="500.0" y="110.0" fill="#1d5fbf" font-size="16" font-weight="700" text-anchor="start">From zero A:</text>
<text x="500.0" y="134.0" fill="#1f2933" font-size="15" text-anchor="start">5 m across, 3 m up</text>
<text x="500.0" y="184.0" fill="#be185d" font-size="16" font-weight="700" text-anchor="start">From zero B:</text>
<text x="500.0" y="208.0" fill="#1f2933" font-size="15" text-anchor="start">3 m left, 2 m down</text>
<text x="500.0" y="262.0" fill="#1f2933" font-size="15" font-weight="700" text-anchor="start">Same toy. Different numbers.</text>
<text x="500.0" y="286.0" fill="#5b7083" font-size="13.5" text-anchor="start">The numbers only make sense</text>
<text x="500.0" y="304.0" fill="#5b7083" font-size="13.5" text-anchor="start">once you know where zero is</text>
<text x="500.0" y="322.0" fill="#5b7083" font-size="13.5" text-anchor="start">and which way the arrows point.</text>
</svg>
